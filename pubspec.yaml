name: saarika
description: Swastik Fashion wholesale buyer app — Material 3 UI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  google_fonts: ^6.2.1
  supabase_flutter: ^2.7.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  dio: ^5.7.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  gal: ^2.3.0
  cached_network_image: ^3.4.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"
  adaptive_icon_background: "#6B1221"
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
